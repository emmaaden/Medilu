<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de paciente — Medilu</title>
  <link rel="icon" type="image/png" href="img/ico.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="theme.css" />
</head>

<body>
  <div class="as-auth">
    <aside class="as-auth__aside">
      <a href="index.html" class="as-auth__brand">
        <img src="img/ico.png" alt=""> Medilu
      </a>
      <div class="as-auth__pitch">
        <h2>Creá tu cuenta de paciente</h2>
        <p>Reservá turnos en minutos y tené tu historia clínica siempre a mano.</p>
        <ul class="as-auth__list">
          <li><i class="bi bi-calendar-heart"></i> Turnos online sin llamadas</li>
          <li><i class="bi bi-bell"></i> Recordatorios automáticos</li>
          <li><i class="bi bi-shield-lock"></i> Tus datos, protegidos</li>
        </ul>
      </div>
    </aside>

    <main class="as-auth__main">
      <div class="as-auth__panel as-auth__panel--wide">
        <div class="as-auth__mobilebrand">
          <img src="img/ico.png" alt=""> Medilu
        </div>

        <h1 class="as-auth__title">Registro de paciente</h1>
        <p class="as-auth__sub">Completá tus datos para crear la cuenta.</p>

        <form id="registerForm" novalidate>
          <div class="as-form-grid">
            <div class="form-floating">
              <input type="number" class="form-control" id="registerDNI" placeholder="DNI" required>
              <label for="registerDNI">DNI</label>
            </div>

            <div class="form-floating">
              <select class="form-select" id="registerSexo" required>
                <option value="" selected disabled>Seleccione...</option>
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
                <option value="O">Otro</option>
              </select>
              <label for="registerSexo">Sexo</label>
            </div>

            <div class="form-floating">
              <input type="text" class="form-control" id="registerNombre" placeholder="Nombre" required>
              <label for="registerNombre">Nombre</label>
            </div>

            <div class="form-floating">
              <input type="text" class="form-control" id="registerApellido" placeholder="Apellido" required>
              <label for="registerApellido">Apellido</label>
            </div>

            <div class="form-floating">
              <input type="date" class="form-control" id="registerNacimiento" placeholder="Fecha de nacimiento" required>
              <label for="registerNacimiento">Fecha de nacimiento</label>
            </div>

            <div class="form-floating">
              <input type="tel" class="form-control" id="registerPhone" placeholder="Teléfono" required>
              <label for="registerPhone">Teléfono</label>
            </div>

            <div class="form-floating">
              <input type="text" class="form-control" id="registerDireccion" placeholder="Dirección" required>
              <label for="registerDireccion">Dirección</label>
            </div>

            <div class="form-floating">
              <input type="text" class="form-control" id="registerObraSocial" placeholder="Obra social" required>
              <label for="registerObraSocial">Obra social</label>
            </div>

            <div class="form-floating">
              <input type="email" class="form-control" id="registerEmail" placeholder="Email" required>
              <label for="registerEmail">Email</label>
            </div>

            <div class="form-floating">
              <input type="password" class="form-control" id="registerPassword" placeholder="Contraseña" required>
              <label for="registerPassword">Contraseña</label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 mt-4">Crear cuenta</button>
        </form>

        <p class="as-auth__foot">¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
      </div>
    </main>
  </div>

  <script src="js/registerPaciente.js"></script>
  <script>
    // Validación nativa: no envía si faltan campos y marca los inválidos.
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      const form = e.target;
      if (!form.checkValidity()) {
        e.preventDefault();
        e.stopPropagation();
        form.classList.add('was-validated');
        const firstInvalid = form.querySelector(':invalid');
        if (firstInvalid) firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  </script>
</body>
</html>
