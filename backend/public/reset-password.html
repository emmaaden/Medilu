<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña — Medilu</title>
  <link rel="icon" type="image/png" href="img/ico.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>

<body>
  <div class="as-auth">
    <aside class="as-auth__aside">
      <a href="index.html" class="as-auth__brand">
        <img src="img/ico.png" alt=""> Medilu
      </a>
      <div class="as-auth__pitch">
        <h2>Definí tu nueva contraseña</h2>
        <p>Elegí una contraseña segura de al menos 6 caracteres. Ya casi estás.</p>
        <ul class="as-auth__list">
          <li><i class="bi bi-shield-check"></i> Tu cuenta queda protegida al instante</li>
        </ul>
      </div>
    </aside>

    <main class="as-auth__main">
      <div class="as-auth__panel">
        <div class="as-auth__mobilebrand">
          <img src="img/ico.png" alt=""> Medilu
        </div>

        <h1 class="as-auth__title">Nueva contraseña</h1>
        <p class="as-auth__sub">Definí la contraseña con la que ingresarás de ahora en más.</p>

        <form id="resetForm">
          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="newPassword" placeholder="Nueva contraseña" minlength="6" required>
            <label for="newPassword"><i class="bi bi-lock me-1"></i> Nueva contraseña</label>
          </div>
          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="confirmPassword" placeholder="Repetir contraseña" minlength="6" required>
            <label for="confirmPassword"><i class="bi bi-lock-fill me-1"></i> Repetir contraseña</label>
          </div>
          <button class="btn btn-primary w-100 py-2" type="submit" id="submitBtn" disabled>Guardar contraseña</button>
        </form>

        <div id="mensaje" class="alert d-none mt-3" role="alert"></div>

        <p class="as-auth__foot"><a href="login.html"><i class="bi bi-arrow-left me-1"></i>Volver a iniciar sesión</a></p>
      </div>
    </main>
  </div>

  <script>
    const form = document.getElementById('resetForm');
    const mensaje = document.getElementById('mensaje');
    const submitBtn = document.getElementById('submitBtn');
    let supabaseClient = null;
    let recoveryReady = false;

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = `alert alert-${tipo} mt-3`;
    }

    function habilitarFormulario() {
      recoveryReady = true;
      submitBtn.disabled = false;
    }

    async function init() {
      let cfg;
      try {
        cfg = await fetch('/api/public-config').then(r => r.json());
      } catch (e) {
        mostrarMensaje('No se pudo obtener la configuración del servidor.', 'danger');
        return;
      }
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
        mostrarMensaje('Falta configurar SUPABASE_KEY_PUBLIC en el servidor.', 'danger');
        return;
      }

      supabaseClient = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

      // El enlace de recuperación trae el token en la URL. supabase-js lo detecta
      // y emite PASSWORD_RECOVERY (flujo implícito con # en la URL).
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) {
          habilitarFormulario();
        }
      });

      // Fallback flujo PKCE: el enlace trae ?code=...
      const params = new URLSearchParams(window.location.search);
      if (params.get('code')) {
        try {
          const { error } = await supabaseClient.auth.exchangeCodeForSession(window.location.href);
          if (!error) habilitarFormulario();
        } catch (e) { /* ignorado: se evalúa la sesión abajo */ }
      }

      // Fallback: si el hash ya fue procesado y hay sesión activa.
      setTimeout(async () => {
        const { data } = await supabaseClient.auth.getSession();
        if (data.session) {
          habilitarFormulario();
        } else if (!recoveryReady) {
          mostrarMensaje('Abrí esta página desde el enlace del email de recuperación.', 'warning');
        }
      }, 900);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!supabaseClient || !recoveryReady) return;

      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) {
        mostrarMensaje('Las contraseñas no coinciden.', 'danger');
        return;
      }

      submitBtn.disabled = true;
      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        mostrarMensaje(`No se pudo actualizar: ${error.message}`, 'danger');
        submitBtn.disabled = false;
        return;
      }

      mostrarMensaje('Contraseña actualizada. Redirigiendo al login...', 'success');
      setTimeout(() => { window.location.href = '/login.html'; }, 2000);
    });

    init();
  </script>
</body>
</html>
